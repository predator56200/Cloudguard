# =============================================================================
# Root tooling configuration — ONE config for the whole Python monorepo
# =============================================================================
# Why here and not in each app's pyproject.toml: three copies of a ruff config drift within a
# month, and then `make lint` passes locally and fails in CI for reasons nobody can explain.
# Tool config is a monorepo-wide concern; package METADATA (dependencies) is per-package.
#
# Roadmap: M0 task 0.13 (quality tooling).
# =============================================================================

# --- Ruff: linting + import sorting ------------------------------------------
# Ruff replaces flake8, isort, pyupgrade, bandit and a dozen plugins with one tool that runs
# in milliseconds. Speed is not vanity: a linter that takes 30 seconds is a linter developers
# disable.
[tool.ruff]
line-length = 95          # matches black below; 88 is cramped for descriptive domain names
target-version = "py312"
extend-exclude = ["migrations/versions"]  # autogenerated; not ours to style

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — real bugs (unused vars, undefined names)
    "I",        # isort — deterministic import order
    "N",        # pep8-naming
    "UP",       # pyupgrade — keep us on modern syntax
    "B",        # flake8-bugbear — mutable default args, etc.
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff's own

    # NOT enabled: "TC" (flake8-type-checking).
    # It wants type-only imports moved into an `if TYPE_CHECKING:` block. That is sound advice
    # in a plain Python codebase and ACTIVELY DANGEROUS in ours: Pydantic and FastAPI resolve
    # annotations AT RUNTIME (to build validators and the OpenAPI schema). A type hidden behind
    # TYPE_CHECKING is a type Pydantic cannot find, and the failure is a confusing
    # `PydanticUndefinedAnnotation` at import time. The startup-time saving is microseconds.
    # Not a trade worth making.
    "ASYNC",    # ⚠️ async footguns — e.g. a BLOCKING call inside an async function.
                #    One `time.sleep()` in an async handler stalls the event loop for EVERY
                #    concurrent request, and it is invisible until it is an incident.
    "S",        # ⚠️ bandit — SECURITY. We are a security company; our own code gets linted
                #    for hardcoded secrets, weak crypto, subprocess injection.
    "DTZ",      # ⚠️ naive datetimes. Enforces the rule in core/clock.py: no datetime.now().
    "BLE",      # blind `except Exception` — the bug that makes a scanner report "all clear"
    "T20",      # no print() — we have structured logging
]
ignore = [
    "E501",     # line length: black already owns this, and it disagrees at the margins
    "B008",     # function call in default arg — this is exactly how FastAPI's Depends() works

    # RUF001/002/003 flag "ambiguous" unicode (— × → –) as possible homoglyph attacks. That is
    # a sound rule for IDENTIFIERS and string literals — a Cyrillic 'а' in a variable name is a
    # genuine supply-chain trick. It is noise in PROSE: this codebase's comments and docstrings
    # are heavy on em-dashes and arrows because they explain WHY, at length, on purpose.
    # We keep the rule off for text and rely on `S` (bandit) + CodeQL for the real attack.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on constants, use fixtures as args, and deliberately construct bad input.
"**/tests/**" = ["S101", "S105", "S106", "DTZ001", "ARG001"]
# The __init__ files are documentation-heavy by design (every module explains WHY it exists).
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["cloudguard_core", "cloudguard_api", "cloudguard_worker"]

# --- Black: formatting -------------------------------------------------------
# Black is non-configurable BY DESIGN. That is its best feature: it ends every formatting
# argument in the codebase permanently, which is worth more than any individual preference.
[tool.black]
line-length = 95
target-version = ["py312"]
extend-exclude = "migrations/versions"

# --- mypy: static types ------------------------------------------------------
# `strict = true` is not optional here. Reasoning: this codebase will hold cross-tenant
# identifiers (org_id: UUID) in every function signature. `def get(org_id)` with no annotation
# accepts a string, an int, or None — and `None` means "no tenant", which in a repository
# means "query without a tenant filter". Types are a TENANT-ISOLATION control, not just
# ergonomics.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Listed EXPLICITLY, never with a blanket
# `ignore_missing_imports = true` — a blanket ignore silently swallows typos in OUR imports.
module = ["arq.*", "structlog.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests", "apps/worker/tests"]
asyncio_mode = "auto"          # no @pytest.mark.asyncio boilerplate on every async test

# `--import-mode=importlib` is REQUIRED in a monorepo, and the reason is worth knowing.
#
# We have three `tests/` directories (core, api, worker). Under pytest's legacy `prepend`
# import mode, each is imported as a top-level package literally named `tests` — so the
# second one to load COLLIDES with the first and collection dies with a confusing
# `ModuleNotFoundError: No module named 'tests.test_ping'`.
#
# The old workaround was to give every tests/ dir an __init__.py and a unique package name.
# `importlib` mode is the modern fix: pytest imports each test module by its file path
# without touching sys.path, so no `tests` package is ever created and the collision cannot
# occur. (This is also why there are no __init__.py files in our tests/ folders — their
# absence is deliberate.)
addopts = "--strict-markers -q --import-mode=importlib"
markers = [
    # The unit/integration split is what keeps `make test-unit` under 5 seconds (docs/10).
    # A fast suite is a suite people actually run; a slow one is decoration.
    "integration: requires a real Postgres and Redis (excluded from the fast suite)",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/migrations/*"]
