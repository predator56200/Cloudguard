# =============================================================================
# Alembic — database migration configuration
# =============================================================================
# WHY THIS LIVES AT THE REPO ROOT (not inside packages/core)
#
# Migrations are an operation on THE DATABASE, which is a deployment-level concern shared by
# the api and the worker — not a property of a Python package. Keeping it at the root means
# `alembic upgrade head` works from one obvious place, and the migration history is visible in
# the top-level tree where a new engineer will actually look for it.
#
# THE IRON RULES (docs/04 § Migrations):
#   1. EVERY schema change is a migration. `Base.metadata.create_all()` NEVER runs — not in
#      dev, not in tests, not ever. The moment dev and prod schemas can diverge, they will,
#      and you will find out during an incident.
#   2. EVERY migration is REVERSIBLE. `downgrade()` is implemented and TESTED in CI
#      (upgrade → downgrade → upgrade). A migration you cannot roll back is a deploy you
#      cannot undo at 3am.
#   3. Autogenerate, then READ AND EDIT the result. Autogenerate does not see RLS policies,
#      partial indexes, or enum value additions — and those are exactly the things this
#      product depends on.
# =============================================================================

[alembic]
script_location = migrations

# Timestamped, ordered, descriptive filenames:  20260714_1432-a1b2c3_add_findings_table.py
# The default is a bare random hash, which makes `ls migrations/versions` useless for
# understanding the order things happened in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for the above. UTC, always — a migration history ordered by local timestamps
# across contributors in different timezones is a history that lies to you.
timezone = UTC

prepend_sys_path = .

# NOTE: sqlalchemy.url is DELIBERATELY EMPTY.
# It is read from the DATABASE_URL environment variable in migrations/env.py, via our
# Settings object. Putting a connection string in a committed file is how production
# credentials end up in git — the exact class of mistake our product is built to detect.

[post_write_hooks]
# Autogenerated migrations get formatted like the rest of the codebase. Small thing; means a
# migration diff is readable in review rather than a wall of unformatted kwargs.
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 95

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
