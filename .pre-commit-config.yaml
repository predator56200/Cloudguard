# =============================================================================
# Pre-commit hooks — the first line of defence
# =============================================================================
# Why: catching a problem at `git commit` costs 2 seconds. Catching the SAME problem in CI
# costs 4 minutes and a context switch. Catching it in review costs a colleague's afternoon.
# Same check, three very different prices.
#
# The `gitleaks` hook is the one that actually matters. It is the difference between "I
# almost committed an API key" and "we rotated every credential and filed a disclosure."
# We are a security company; a secret in our git history is a headline.
#
# Install once:  pip install pre-commit && pre-commit install
# Roadmap: M0 task 0.13.
# =============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files # a 50MB blob in git history is forever
        args: ["--maxkb=1000"]
      - id: detect-private-key

  # --- Secret scanning: THE critical hook ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Python: lint + import sorting ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  # --- Python: formatting. Black is non-negotiable and non-configurable BY DESIGN —
  #     it ends every formatting argument permanently, which is worth more than any
  #     individual preference. ---
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # --- Frontend: Prettier ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|css|md)$
